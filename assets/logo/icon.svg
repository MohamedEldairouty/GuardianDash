<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="GuardianDash app icon">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="arcGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FB7185"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bgGrad)"/>

  <!-- Soft halo -->
  <circle cx="512" cy="512" r="320" fill="url(#glow)"/>

  <!-- Gauge track (270°) -->
  <path d="M 318.5 705.5 A 280 280 0 1 1 705.5 705.5"
        stroke="rgba(255,255,255,0.18)"
        stroke-width="56"
        stroke-linecap="round"
        fill="none"/>

  <!-- Gauge progress (~72%) -->
  <path d="M 318.5 705.5 A 280 280 0 1 1 730 327"
        stroke="url(#arcGrad)"
        stroke-width="56"
        stroke-linecap="round"
        fill="none"/>

  <!-- Tick marks -->
  <g stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.55">
    <line x1="262" y1="650" x2="294" y2="678"/>
    <line x1="240" y1="512" x2="280" y2="512"/>
    <line x1="320" y1="312" x2="344" y2="344"/>
    <line x1="512" y1="232" x2="512" y2="272"/>
    <line x1="704" y1="312" x2="680" y2="344"/>
    <line x1="784" y1="512" x2="744" y2="512"/>
    <line x1="762" y1="650" x2="730" y2="678"/>
  </g>

  <!-- Needle -->
  <g transform="translate(512 512)">
    <polygon points="-12,24 12,24 4,-216 -4,-216" fill="#FFFFFF" transform="rotate(50)"/>
  </g>

  <!-- Center hub -->
  <circle cx="512" cy="512" r="44" fill="#0B0F1A" stroke="#FFFFFF" stroke-width="8"/>
  <circle cx="512" cy="512" r="18" fill="#FFFFFF"/>
</svg>
