# Render Blueprint for the GuardianDash backend.
#
# How to deploy:
#   1. Push this repo to GitHub.
#   2. Sign in at https://dashboard.render.com (free, GitHub auth).
#   3. New → Blueprint → connect your GuardianDash repo.
#   4. Blueprint Path: backend/render.yaml
#   5. Apply → wait ~5 min for the first build.
#   6. You'll get a URL like https://guardiandash-api.onrender.com.
#      Set EXPO_PUBLIC_API_BASE in app/.env to that URL and restart Expo.
#
# Free-tier caveats:
#   - Free instances sleep after 15 min of inactivity (first request takes
#     ~30s to wake up).
#   - No persistent disk on free tier — SQLite lives in ephemeral storage.
#     Practically this means the DB survives normal use but is reset whenever
#     you push code (= a new container). For a demo this is fine; for a real
#     product you'd upgrade to a Starter plan (~$7/mo) and re-add the disk,
#     OR switch to managed Postgres (see docs/DEPLOY.md → "Going to Postgres").

services:
  - type: web
    name: guardiandash-api
    runtime: docker
    region: frankfurt          # change to your nearest region
    plan: free
    rootDir: backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GD_API_PORT
        value: 4000
      - key: GD_JWT_SECRET
        generateValue: true     # Render generates a strong random secret
